<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>dev/rep — code review, by humans</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #FAFAF7;
            --ink: #141412;
            --mut: #8B8B82;
            --line: #E5E5DE;
            --card: #FFFFFF;
            --acc: #2E5BFF;
            --soft: #EEF1FF;
            --ok: #1E9E5A;
            --warn: #C77E0A;
            --bad: #D64545;
            --r: 10px;
        }

        html.dark {
            --bg: #0D0D0C;
            --ink: #F1F1EC;
            --mut: #87877F;
            --line: #252522;
            --card: #151513;
            --acc: #7B93FF;
            --soft: #181B2A
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh
        }

        button {
            font-family: inherit;
            cursor: pointer;
            font-size: inherit
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11.5px;
            letter-spacing: .03em
        }

        .hide {
            display: none !important
        }

        /* ── header ── */
        #hd {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 26px;
            padding: 0 36px;
            height: 60px;
            border-bottom: 1px solid var(--line);
            background: color-mix(in srgb, var(--bg) 86%, transparent);
            backdrop-filter: blur(14px)
        }

        .wm {
            font-weight: 700;
            font-size: 17px;
            letter-spacing: -.02em;
            cursor: pointer
        }

        .wm i {
            color: var(--acc);
            font-style: normal
        }

        #hd nav {
            display: flex;
            gap: 4px
        }

        #hd nav a {
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--mut);
            cursor: pointer
        }

        #hd nav a:hover {
            color: var(--ink)
        }

        #hd nav a.on {
            color: var(--ink);
            font-weight: 600;
            background: var(--soft);
            color: var(--acc)
        }

        .sp {
            flex: 1
        }

        .ib {
            background: none;
            border: 1px solid var(--line);
            border-radius: 9px;
            width: 35px;
            height: 35px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--mut);
            position: relative
        }

        .ib:hover {
            color: var(--ink);
            border-color: var(--ink)
        }

        .ib .n {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--acc);
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            min-width: 15px;
            height: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono'
        }

        .av {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--ink);
            color: var(--bg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0
        }

        .kb {
            font-family: 'JetBrains Mono';
            font-size: 10px;
            border: 1px solid var(--line);
            border-bottom-width: 2px;
            border-radius: 5px;
            padding: 2px 7px;
            color: var(--mut)
        }

        /* ── layout ── */
        #view {
            min-height: calc(100vh - 60px)
        }

        .wrap {
            max-width: 1080px;
            margin: 0 auto;
            padding: 44px 40px
        }

        .split {
            display: flex;
            min-height: calc(100vh - 60px)
        }

        .side {
            width: 212px;
            border-right: 1px solid var(--line);
            padding: 28px 14px;
            flex-shrink: 0
        }

        .side a {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 9px 13px;
            border-radius: 8px;
            color: var(--mut);
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 2px
        }

        .side a.on {
            background: var(--soft);
            color: var(--acc);
            font-weight: 600
        }

        .side a:hover {
            color: var(--ink)
        }

        .side .grow {
            flex: 1
        }

        .side .lvl {
            margin: 16px 13px 0;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 10px
        }

        .main {
            flex: 1;
            padding: 44px 48px;
            min-width: 0
        }

        h1 {
            font-size: 29px;
            letter-spacing: -.03em;
            font-weight: 700
        }

        h2 {
            font-size: 12px;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--mut);
            margin: 34px 0 14px;
            font-weight: 600
        }

        .lead {
            color: var(--mut);
            margin: 6px 0 30px;
            font-size: 15px
        }

        /* ── atoms ── */
        .btn {
            border-radius: 9px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: var(--bg);
            padding: 9px 18px;
            font-size: 13.5px;
            font-weight: 600;
            transition: .15s;
            display: inline-flex;
            gap: 8px;
            align-items: center
        }

        .btn:hover {
            opacity: .86
        }

        .btn.acc {
            background: var(--acc);
            border-color: var(--acc);
            color: #fff
        }

        .btn.ok {
            background: var(--ok);
            border-color: var(--ok);
            color: #fff
        }

        .btn.gh {
            background: transparent;
            color: var(--ink);
            border-color: var(--line)
        }

        .btn.gh:hover {
            border-color: var(--ink);
            opacity: 1
        }

        .btn.sm {
            padding: 6px 12px;
            font-size: 12.5px
        }

        .btn:disabled {
            opacity: .35;
            cursor: not-allowed
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 20px 22px
        }

        .grid {
            display: grid;
            gap: 14px
        }

        .g3 {
            grid-template-columns: repeat(3, 1fr)
        }

        .g2 {
            grid-template-columns: repeat(2, 1fr)
        }

        .pill {
            font-family: 'JetBrains Mono';
            font-size: 10.5px;
            padding: 3px 10px;
            border-radius: 99px;
            font-weight: 500;
            display: inline-block
        }

        .pg {
            color: var(--ok);
            background: color-mix(in srgb, var(--ok) 13%, transparent)
        }

        .py {
            color: var(--warn);
            background: color-mix(in srgb, var(--warn) 13%, transparent)
        }

        .pr {
            color: var(--bad);
            background: color-mix(in srgb, var(--bad) 11%, transparent)
        }

        .pb {
            color: var(--acc);
            background: var(--soft)
        }

        .pn {
            color: var(--mut);
            background: color-mix(in srgb, var(--mut) 13%, transparent)
        }

        .chip {
            font-family: 'JetBrains Mono';
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 99px;
            border: 1px solid var(--line);
            color: var(--mut);
            background: none
        }

        .chip.on {
            border-color: var(--acc);
            color: var(--acc);
            background: var(--soft)
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 16px 0 22px
        }

        input,
        select,
        textarea {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--ink)
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--acc);
            box-shadow: 0 0 0 3px var(--soft)
        }

        label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--mut);
            display: block;
            margin: 16px 0 7px
        }

        .bar {
            height: 5px;
            background: var(--line);
            border-radius: 3px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--acc);
            border-radius: 3px;
            transition: width .7s cubic-bezier(.2, .8, .2, 1)
        }

        .tblw {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        th {
            font-size: 10.5px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--mut);
            text-align: left;
            font-weight: 600;
            padding: 11px 16px;
            border-bottom: 1px solid var(--line)
        }

        td {
            padding: 13px 16px;
            border-bottom: 1px solid var(--line);
            font-size: 14px
        }

        tr:last-child td {
            border: none
        }

        .act {
            color: var(--acc);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden
        }

        .stat {
            background: var(--card);
            padding: 20px 22px
        }

        .stat span {
            font-size: 10.5px;
            color: var(--mut);
            font-family: 'JetBrains Mono';
            letter-spacing: .07em
        }

        .stat b {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -.03em;
            display: block;
            margin: 4px 0 2px
        }

        .stat em {
            font-style: normal;
            font-size: 11px;
            font-family: 'JetBrains Mono';
            color: var(--ok)
        }

        .avsm {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--line);
            color: var(--ink);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 700;
            vertical-align: middle;
            margin-right: 6px
        }

        .hr {
            border: none;
            border-top: 1px solid var(--line);
            margin: 18px 0
        }

        .r {
            text-align: right
        }

        .fade {
            animation: fd .3s ease
        }

        @keyframes fd {
            from {
                opacity: 0;
                transform: translateY(5px)
            }
        }

        /* ── toast / palette ── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--ink);
            color: var(--bg);
            padding: 13px 18px;
            border-radius: 10px;
            font-size: 13.5px;
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 99;
            animation: tin .25s cubic-bezier(.2, .9, .3, 1.15);
            max-width: 360px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, .28)
        }

        .toast .d {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok);
            flex-shrink: 0
        }

        @keyframes tin {
            from {
                transform: translateY(14px);
                opacity: 0
            }
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .42);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            z-index: 80;
            padding-top: 14vh
        }

        .cmdk {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            width: 540px;
            max-width: 92vw;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .3);
            overflow: hidden
        }

        .cmdk input {
            border: none;
            border-radius: 0;
            border-bottom: 1px solid var(--line);
            padding: 17px 20px;
            font-size: 15px
        }

        .cmdk input:focus {
            box-shadow: none;
            border: none
        }

        .cmdk .it {
            padding: 12px 20px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            gap: 10px
        }

        .cmdk .it:hover {
            background: var(--soft)
        }

        .cmdk .it small {
            margin-left: auto;
            color: var(--mut);
            font-family: 'JetBrains Mono';
            font-size: 10.5px
        }

        /* ── auth / landing ── */
        .authbox {
            max-width: 390px;
            margin: 11vh auto;
            padding: 0 24px
        }

        .hero {
            max-width: 920px;
            margin: 0 auto;
            padding: 96px 40px 72px
        }

        .hero h1 {
            font-size: clamp(36px, 5.6vw, 60px);
            line-height: 1.06;
            letter-spacing: -.04em
        }

        .hero h1 em {
            color: var(--acc);
            font-style: normal
        }

        .hero p {
            color: var(--mut);
            font-size: 17.5px;
            margin: 20px 0 32px;
            max-width: 520px
        }

        .tick {
            display: flex;
            gap: 22px;
            margin-top: 18px;
            font-family: 'JetBrains Mono';
            font-size: 11px;
            color: var(--mut)
        }

        .tick b {
            color: var(--ink)
        }

        .marq {
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            padding: 13px 0;
            overflow: hidden;
            white-space: nowrap
        }

        .marq span {
            display: inline-block;
            animation: mq 24s linear infinite;
            font-family: 'JetBrains Mono';
            font-size: 11.5px;
            color: var(--mut)
        }

        @keyframes mq {
            to {
                transform: translateX(-50%)
            }
        }

        .feat {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--line);
            border-top: 1px solid var(--line)
        }

        .feat>div {
            background: var(--bg);
            padding: 38px 34px
        }

        .feat .n {
            font-family: 'JetBrains Mono';
            font-size: 11px;
            color: var(--acc)
        }

        .feat b {
            display: block;
            font-size: 16.5px;
            margin: 12px 0 6px
        }

        .feat p {
            color: var(--mut);
            font-size: 14px
        }

        .empty {
            border: 1px dashed var(--line);
            border-radius: 12px;
            padding: 36px;
            text-align: center;
            color: var(--mut);
            font-size: 14px
        }

        .diff {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px
        }

        .d-e {
            background: var(--ok)
        }

        .d-m {
            background: var(--warn)
        }

        .d-h {
            background: var(--bad)
        }

        @media(max-width:840px) {
            .side {
                display: none
            }

            .wrap,
            .main {
                padding: 24px 18px 96px
            }

            .split {
                display: block
            }

            .g3,
            .g2 {
                grid-template-columns: 1fr
            }

            .stats {
                grid-template-columns: 1fr 1fr
            }

            .stat b {
                font-size: 24px
            }

            #hd {
                padding: 0 14px;
                gap: 10px;
                height: 56px
            }

            .wm {
                font-size: 15px
            }

            #hd nav {
                display: none
            }

            .kb {
                display: none
            }

            .hero {
                padding: 56px 22px 48px
            }

            .hero p {
                font-size: 15.5px
            }

            .hero h1 {
                font-size: clamp(30px, 8vw, 44px)
            }

            .feat {
                grid-template-columns: 1fr
            }

            .feat>div {
                padding: 28px 22px
            }

            h1 {
                font-size: 24px
            }

            .lead {
                margin-bottom: 22px;
                font-size: 14px
            }

            .card {
                padding: 16px
            }

            .authbox {
                margin: 6vh auto
            }

            /* scrollable table rows */
            .tblw {
                overflow-x: auto
            }

            table {
                min-width: 540px
            }

            /* bottom tab bar */
            #tabbar {
                display: flex !important
            }

            #toastwrap {
                bottom: 84px
            }

            /* stack flex cards vertically */
            .card[style*="display:flex"] {
                flex-wrap: wrap
            }

            .btn {
                padding: 11px 18px;
                font-size: 14px
            }

            .btn.sm {
                padding: 9px 14px
            }

            input,
            select,
            textarea {
                font-size: 16px
            }

            /* stops iOS zoom-on-focus */
        }

        /* bottom mobile tab bar */
        #tabbar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
            background: var(--card);
            border-top: 1px solid var(--line);
            padding: 6px 8px calc(8px + env(safe-area-inset-bottom))
        }

        #tabbar a {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: var(--mut);
            font-family: 'JetBrains Mono';
            padding: 7px 0;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none
        }

        #tabbar a.on {
            color: var(--acc);
            background: var(--soft)
        }

        #tabbar a .ic {
            font-size: 17px
        }
    </style>
</head>

<body>

    <header id="hd">
        <div class="wm" onclick="go('landing')">dev<i>/</i>rep</div>
        <nav id="nav"></nav>
        <div class="sp"></div>
        <button class="ib" onclick="openK()">⌕</button>
        <span class="kb">⌘K</span>
        <button class="ib" onclick="toggleTheme()" title="Theme">◐</button>
        <span id="hdRight"></span>
    </header>
    <div id="view"></div>

    <script>
        /* ══════════════════ STORE (localStorage) ══════════════════ */
        const DB = 'devrep_v1';
        const seed = {
            users: [
                { id: 1, name: 'Sara Mohamed', email: 'sara@dev.io', pw: 'demo1234', role: 'junior', mentor: 'pending', xp: 1250, level: 4, badges: 6, joined: '2024' },
                { id: 2, name: 'Alex Karim', email: 'alex@dev.io', pw: 'demo1234', role: 'mentor', mentor: 'approved', xp: 1890, level: 6, badges: 9, joined: '2023' },
                { id: 3, name: 'Nadia H.', email: 'admin@dev.io', pw: 'demo1234', role: 'admin', mentor: 'none', xp: 0, level: 0, badges: 0, joined: '2023' }
            ],
            session: null,
            attempts: [
                { id: 'A-1042', user: 1, asg: 'REST API in NestJS', diff: 'medium', xp: 100, status: 'in_review', mentor: 2, repo: 'github.com/devrep/restapi-sara', pr: 12, ago: '2H AGO' },
                { id: 'A-1039', user: 1, asg: 'Build a CLI tool', diff: 'easy', xp: 50, status: 'completed', mentor: 2, repo: 'github.com/devrep/cli-sara', pr: 9, ago: '6D AGO' },
                { id: 'A-1031', user: 1, asg: 'CI/CD Pipeline', diff: 'hard', xp: 150, status: 'changes', mentor: 2, repo: 'github.com/devrep/cicd-sara', pr: 7, ago: '1W AGO' }
            ],
            notifs: [
                { id: 1, user: 1, txt: 'Review completed — Build a CLI tool · +50 XP', kind: 'ok', ago: '2M' },
                { id: 2, user: 1, txt: 'Changes requested — CI/CD Pipeline', kind: 'warn', ago: '1H' },
                { id: 3, user: 1, txt: 'Mentor application received — pending admin review', kind: 'acc', ago: '3H' }
            ]
        };
        let db = JSON.parse(localStorage.getItem(DB) || 'null') || seed;
        function save() { localStorage.setItem(DB, JSON.stringify(db)) }
        save();
        const me = () => db.users.find(u => u.id === db.session) || null;
        const uname = id => db.users.find(u => u.id === id)?.name || '—';
        const XPCAP = 1500;

        /* ══════════════════ DATA ══════════════════ */
        const ASGS = [
            { name: 'Build a CLI tool', diff: 'easy', xp: 50, h: '4H', stack: 'NODE.JS', desc: 'Parse args, stream output, exit codes that mean something.', n: 210 },
            { name: 'REST API in NestJS', diff: 'medium', xp: 100, h: '8H', stack: 'NESTJS', desc: 'CRUD, validation, honest errors. Boundaries over features.', n: 145 },
            { name: 'WebSocket Chat', diff: 'medium', xp: 90, h: '6H', stack: 'SOCKET.IO', desc: 'Rooms, presence, reconnect. Latency is a design decision.', n: 67 },
            { name: 'CI/CD Pipeline', diff: 'hard', xp: 150, h: '12H', stack: 'DOCKER', desc: 'Build, test, ship. Every stage needs a reason to exist.', n: 88 },
            { name: 'Markdown Parser', diff: 'easy', xp: 40, h: '3H', stack: 'NODE.JS', desc: 'No regex soup. A real tokenizer.', n: 156 },
            { name: 'Rate Limiter', diff: 'hard', xp: 180, h: '10H', stack: 'REDIS', desc: 'Token bucket vs sliding window — pick one and defend it.', n: 41 }
        ];
        const LB = [
            { name: 'Sara M.', xp: 1250, pct: 85, you: true },
            { name: 'Omar K.', xp: 1180, pct: 78 },
            { name: 'Leila H.', xp: 1020, pct: 65 },
            { name: 'Yassine B.', xp: 940, pct: 60 }
        ];

        /* ══════════════════ HELPERS ══════════════════ */
        const $ = s => document.querySelector(s);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

                var color = i < 3 ? 'var(--acc)' : 'var(--mut)';
                var you = u2.you ? ' <span class="pill pb">you</span>' : '';
                var hl = u2.you ? ' style="background:var(--soft)"' : '';
                html += '<tr' + hl + '><td class="mono" style="width:46px;color:' + color + '">' + rank + '</td>'
                    + '<td><b>' + esc(u2.name) + '</b>' + you + '</td>'
                    + '<td class="mono">LVL ' + Math.floor(u2.xp / 350 + 1) + '</td>'
                    + '<td class="mono"><b>' + u2.xp.toLocaleString() + '</b></td>'
                    + '<td><div class="bar"><i style="width:' + u2.pct + '%"></i></div></td></tr>';
            });
            html += '</table></div><p class="mono" style="color:var(--mut);margin-top:12px">LIVE OVER WEBSOCKET · TOP 50 · SEASON 1</p>';
            el.innerHTML = html;
        }

        /* ---- profile ---- */
        VIEWS.profile = () => {
            const u = me(); if (!u) return VIEWS.login();
            return shell(sideFor(u), '<div style="max-width:640px">'
                + '<div style="display:flex;gap:18px;align-items:center;margin-bottom:28px">'
                + '<div class="av" style="width:62px;height:62px;font-size:22px">' + esc(u.name[0]) + '</div>'
                + '<div><h1 style="font-size:23px">' + esc(u.name) + '</h1><div class="mono" style="color:var(--mut)">' + u.role.toUpperCase() + ' · ' + esc(u.email) + ' · SINCE ' + u.joined + '</div></div>'
                + (u.role === 'junior' && u.mentor !== 'none' ? '<span class="pill ' + (u.mentor === 'approved' ? 'pg' : 'py') + '" style="margin-left:auto">mentor: ' + u.mentor + '</span>' : '')
                + '</div>'
                + '<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><span>XP</span><b>' + u.xp + '</b></div><div class="stat"><span>LEVEL</span><b>' + u.level + '</b></div><div class="stat"><span>BADGES</span><b>' + u.badges + '</b></div></div>'
                + '<h2>XP history — server-awarded only</h2><div class="tblw"><table>'
                + myAttempts().filter(a => a.status === 'completed').map(a => '<tr><td>Assignment completed</td><td class="mono" style="color:var(--mut)">' + esc(a.asg.toUpperCase()) + '</td><td class="mono" style="color:var(--ok)">+' + a.xp + '</td></tr>').join('')
                + '<tr><td>Welcome badge</td><td class="mono" style="color:var(--mut)">SIGNUP</td><td class="mono" style="color:var(--ok)">+25</td></tr>'
                + '</table></div></div>');
        };

        /* ---- notifications ---- */
        VIEWS.notifications = () => {
            const u = me(); if (!u) return VIEWS.login();
            const list = db.notifs.filter(n => n.user === u.id);
            return shell([], '', '').replace('<div class="main"></div>', ''), // guard
                '<div class="split"><div class="side"><a onclick="go(\'dash\')">← Back</a></div><div class="main" style="max-width:600px">'
                + '<h1>Notifications</h1><p class="lead">Live — no refresh needed.</p>'
                + (list.length ? list.map(n => '<div class="card" style="border-left:3px solid var(--' + (n.kind === 'ok' ? 'ok' : n.kind === 'warn' ? 'warn' : 'acc') + ');margin-bottom:10px;display:flex;gap:12px;align-items:center"><div style="flex:1"><b>' + esc(n.txt) + '</b></div><span class="mono" style="color:var(--mut)">' + n.ago + '</span></div>').join('') : '<div class="empty">All caught up.</div>')
                + (list.length ? '<button class="btn gh sm" onclick="clearNotifs()">Mark all read</button>' : '')
                + '</div></div>';
        };
        function clearNotifs() { db.notifs = db.notifs.filter(n => n.user !== me().id); save(); toast('All notifications cleared'); render() }

        /* ---- become mentor ---- */
        VIEWS.mapp = () => {
            const u = me(); if (!u) return VIEWS.login();
            if (u.role === 'mentor') return shell(sideFor(u), '<div class="empty" style="max-width:520px;margin:60px auto">You are already a verified mentor. 🟢<br><br><span class="act" onclick="go(\'queue\')">Open review queue →</span></div>');
            return shell(sideFor(u), '<div style="max-width:560px">'
                + '<div class="mono" style="color:var(--acc)">APPLICATION · REVIEWED BY ADMINS · ~48H</div>'
                + '<h1 style="margin:8px 0 4px">Become a mentor</h1><p class="lead">Verified mentors review code, shape reputations, earn XP.</p>'
                + '<div class="card"><label>Years of experience</label><select id="ma-yrs"><option>1–3 years</option><option selected>3–5 years</option><option>5–10 years</option><option>10+ years</option></select>'
                + '<label>Main technologies</label><input id="ma-tech" value="React, Node.js">'
                + '<label>GitHub profile URL *</label><input id="ma-gh" value="https://github.com/' + esc(u.name.split(' ')[0].toLowerCase()) + '-dev">'
                + '<label>Why you?</label><textarea id="ma-why" rows="4" placeholder="What makes your reviews worth waiting for?"></textarea>'
                + '<button class="btn acc" style="width:100%;margin-top:20px" onclick="applyMentor()">Submit application</button>'
                + (u.mentor === 'pending' ? '<p class="mono" style="text-align:center;color:var(--warn);font-size:10.5px;margin-top:12px">CURRENT STATUS: PENDING</p>' : '')
                + '</div></div>');
        };
        function applyMentor() {
            const u = me();
            if (!('#ma-gh').value.trim()) { ('#ma-why').style.borderColor = 'var(--bad)'; toast('GitHub URL is required'); return }
            u.mentor = 'pending'; save();
            db.notifs.push({ id: Date.now(), user: u.id, txt: 'Mentor application submitted — awaiting admin review', kind: 'acc', ago: 'NOW' });
            save(); toast('Application submitted — an admin will review it'); go('dash');
        }

        /* ---- mentor: queue + review ---- */
        let curAttempt = null;
        VIEWS.queue = () => {
            const u = me(); if (!u || u.role !== 'mentor') return VIEWS.login();
            const pend = db.attempts.filter(a => a.status === 'in_review');
            return shell(sideFor(u), '<h1>Review queue</h1><p class="lead">First come, one mentor per attempt. Claims are locked.</p>'
                + '<div class="card" style="border-left:3px solid var(--warn);margin-bottom:20px;font-size:13.5px"><span class="mono" style="color:var(--warn)">RULE —</span> You cannot review your own submission.</div>'
                + '<div class="tblw"><table><tr><th>Assignment</th><th>Student</th><th>Submitted</th><th>Status</th><th></th></tr>'
                + (pend.length ? pend.map(a => '<tr><td><b>' + esc(a.asg) + '</b></td><td>' + esc(uname(a.user)) + '</td><td class="mono" style="color:var(--mut)">' + a.ago + '</td><td>' + (a.mentor ? '<span class="pill pg">claimed · ' + esc(uname(a.mentor)) + '</span>' : '<span class="pill pb">open</span>') + '</td><td class="r">' + (a.mentor && a.mentor !== u.id ? '<span class="mono" style="color:var(--mut)">LOCKED</span>' : '<button class="btn sm" onclick="claimAttempt(\'' + a.id + '\')">Claim</button>') + '</td></tr>').join('') : '<tr><td colspan="5" style="text-align:center;padding:36px;color:var(--mut)">Queue is empty. Nice.</td></tr>')
                + '</table></div>');
        };
        function claimAttempt(id) {
            const u = me(), a = db.attempts.find(x => x.id === id);
            if (!a || a.status !== 'in_review') { toast('Already taken'); return }
            if (a.user === u.id) { toast('Blocked — you cannot review your own submission'); return }
            a.mentor = u.id; save(); curAttempt = id; toast('Claimed — locked to you'); go('review');
        }
        function renderQueueTable(elId) {
            const el = document.getElementById(elId); if (!el) return;
            const pend = db.attempts.filter(a => a.status === 'in_review');
            el.innerHTML = '<div class="tblw"><table><tr><th>Assignment</th><th>Student</th><th>Waiting</th><th></th></tr>'
                + (pend.length ? pend.map(a => '<tr><td><b>' + esc(a.asg) + '</b></td><td><span class="avsm">' + esc(uname(a.user)[0]) + '</span>' + esc(uname(a.user)) + '</td><td class="mono" style="color:' + (a.ago.includes('D') || a.ago.includes('W') ? 'var(--warn)' : 'var(--mut)') + '">' + a.ago + '</td><td class="r"><button class="btn sm" onclick="claimAttempt(\'' + a.id + '\')">Claim</button></td></tr>').join('') : '<tr><td colspan="4" style="color:var(--mut);text-align:center;padding:30px">Nothing waiting.</td></tr>')
                + '</table></div>';
        }
        VIEWS.review = () => {
            const u = me(); if (!u || u.role !== 'mentor') return VIEWS.login();
            const a = db.attempts.find(x => x.id === curAttempt);
            if (!a) return shell(sideFor(u), '<div class="empty" style="max-width:480px;margin:60px auto">No attempt claimed.<br><br><span class="act" onclick="go(\'queue\')">Open the queue →</span></div>');
            return shell(sideFor(u), '<div class="mono" style="color:var(--mut)">REVIEWING · CLAIMED BY YOU · LOCKED</div>'
                + '<h1 style="margin:8px 0 4px">' + esc(a.asg) + '</h1><p class="lead">' + esc(uname(a.user)) + ' · PR <span class="act">#' + a.pr + ' ↗</span> · +320 −45 · 14 files</p>'
                + '<div class="grid g2" style="align-items:start">'
                + '<div class="card"><h2 style="margin-top:0">Diff preview</h2>'
                + '<div style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;font-family:\'JetBrains Mono\';font-size:11.5px;line-height:2">'
                + '<div style="color:var(--ok)">+ const app = await NestFactory.create(AppModule)</div>'
                + '<div style="color:var(--ok)">+ @Get() findAll(@Query() q: QueryDto) {</div>'
                + '<div style="color:var(--warn)">!   if (!q.limit) q.limit = 20  // validate first?</div>'
                + '<div style="color:var(--bad)">−   app.listen(3000)</div>'
                + '<div style="color:var(--mut)">@@ 14 files · +320 −45 @@</div></div>'
                + '<p class="mono" style="font-size:10px;color:var(--mut);margin-top:12px">LINE COMMENTS HAPPEN ON GITHUB — DEVREP STORES THE VERDICT.</p></div>'
                + '<div class="card"><h2 style="margin-top:0">Verdict</h2>'
                + '<label>Rubric</label><div class="mono" style="font-size:12px;color:var(--mut);line-height:2.8">'
                + 'CORRECTNESS <input type="range" min="1" max="5" value="4" style="width:120px" oninput="this.nextElementSibling.textContent=\' \'+this.value+\'/5\'"><b> 4/5</b><br>'
                + 'CODE STYLE&nbsp;&nbsp; <input type="range" min="1" max="5" value="3" style="width:120px" oninput="this.nextElementSibling.textContent=\' \'+this.value+\'/5\'"><b> 3/5</b><br>'
                + 'TESTING&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <input type="range" min="1" max="5" value="4" style="width:120px" oninput="this.nextElementSibling.textContent=\' \'+this.value+\'/5\'"><b> 4/5</b></div>'
                + '<label>Summary</label><textarea id="rv-sum" rows="3" placeholder="Solid structure — see my note on query validation…"></textarea>'
                + '<div style="display:flex;gap:8px;margin-top:18px"><button class="btn ok" style="flex:1" onclick="submitReview(true)">✓ Approve</button><button class="btn gh" style="flex:1" onclick="submitReview(false)">↺ Changes</button></div>'
                + '<button class="btn gh sm" style="width:100%;margin-top:8px" onclick="toast(\'Draft saved\')">Save draft</button></div></div>');
        };
        function submitReview(approve) {
            const u = me(), a = db.attempts.find(x => x.id === curAttempt);
            if (!a) return;
            const student = db.users.find(x => x.id === a.user);
            if (approve) {
                a.status = 'completed';
                student.xp += a.xp; student.level = Math.floor(student.xp / 350 + 1); student.badges++;
                db.notifs.push({ id: Date.now(), user: student.id, txt: 'Review completed — ' + a.asg + ' · +' + a.xp + ' XP', kind: 'ok', ago: 'NOW' });
                u.xp += 20; u.level = Math.floor(u.xp / 350 + 1);
                toast('Approved — ' + student.name + ' earned +' + a.xp + ' XP, you earned +20');
            } else {
                a.status = 'changes';
                db.notifs.push({ id: Date.now(), user: student.id, txt: 'Changes requested — ' + a.asg, kind: 'warn', ago: 'NOW' });
                toast('Changes requested — ' + student.name + ' has been notified');
            }
            a.ago = 'JUST NOW'; curAttempt = null; save(); go('queue');
        }

        /* ---- admin: users, apps, assignments ---- */
        VIEWS.users = () => {
            const u = me(); if (!u || u.role !== 'admin') return VIEWS.login();
            return shell(sideFor(u), '<h1>Users</h1><p class="lead">Role changes are enforced server-side — this UI just does it first.</p>'
                + '<div style="display:flex;gap:10px;margin-bottom:16px"><input placeholder="Search name, email…" oninput="filterUsers(this.value)"></div>'
                + '<div class="tblw"><table id="usertab"><tr><th>User</th><th>Role</th><th>Mentor</th><th>XP</th><th></th></tr>'
                + db.users.map(x => '<tr><td><span class="avsm">' + esc(x.name[0]) + '</span><b>' + esc(x.name) + '</b><div class="mono" style="color:var(--mut)">' + esc(x.email) + '</div></td>'
                    + '<td><span class="pill ' + (x.role === 'admin' ? 'pr' : x.role === 'mentor' ? 'pg' : 'pb') + '">' + x.role + '</span></td>'
                    + '<td>' + (x.mentor === 'pending' ? '<span class="pill py">pending</span>' : x.mentor === 'approved' ? '<span class="pill pg">approved</span>' : '—') + '</td>'
                    + '<td class="mono">' + x.xp + '</td>'
                    + '<td class="r">' + (x.role === 'junior' ? '<button class="btn gh sm" onclick="makeMentor(' + x.id + ')">Make mentor</button> ' : '') + (x.role !== 'admin' ? '<button class="btn gh sm" onclick="banUser(' + x.id + ',this)">Ban</button>' : '<span class="mono" style="color:var(--mut)">PROTECTED</span>') + '</td></tr>').join('')
                + '</table></div>');
        };
        function filterUsers(q) { q = q.toLowerCase(); document.querySelectorAll('#usertab tr').forEach(function (r, i) { if (!i) return; r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none' }) }
        function makeMentor(id) {
            const x = db.users.find(y => y.id === id); if (!x) return;
            x.role = 'mentor'; x.mentor = 'approved'; save();
            db.notifs.push({ id: Date.now(), user: x.id, txt: 'You are now a verified mentor — review queue unlocked', kind: 'ok', ago: 'NOW' });
            save(); toast(x.name + ' promoted to MENTOR — audited'); render();
        }
        function banUser(id, btn) {
            if (!btn.dataset.c) { btn.textContent = 'Confirm?'; btn.dataset.c = 1; setTimeout(function () { btn.textContent = 'Ban'; delete btn.dataset.c }, 2500); return }
            const x = db.users.find(y => y.id === id); db.users = db.users.filter(y => y.id !== id); save();
            toast(x.name + ' deleted — audit log updated'); render();
        }
        VIEWS.mapps = () => {
            const u = me(); if (!u || u.role !== 'admin') return VIEWS.login();
            const pend = db.users.filter(x => x.mentor === 'pending');
            return shell(sideFor(u), '<h1>Mentor applications</h1><p class="lead">Approval flips the role — server-side, audited, live everywhere.</p>'
                + (pend.length ? pend.map(x => '<div class="card" style="margin-bottom:14px">'
                    + '<div style="display:flex;gap:14px;align-items:center"><div class="av">' + esc(x.name[0]) + '</div>'
                    + '<div style="flex:1"><b>' + esc(x.name) + '</b><div class="mono" style="color:var(--mut)">' + esc(x.email) + ' · XP ' + x.xp + '</div></div>'
                    + '<span class="pill py">pending</span></div>'
                    + '<div style="display:flex;gap:8px;margin-top:16px"><button class="btn ok sm" onclick="approveApp(' + x.id + ',this)">Approve</button>'
                    + '<button class="btn gh sm" onclick="rejectApp(' + x.id + ',this)">Reject</button></div></div>').join('')
                    : '<div class="empty">No pending applications.</div>'));
        };
        function approveApp(id, btn) {
            const x = db.users.find(y => y.id === id);
            x.role = 'mentor'; x.mentor = 'approved'; save();
            db.notifs.push({ id: Date.now(), user: x.id, txt: 'Mentor application approved — welcome to the desk', kind: 'ok', ago: 'NOW' });
            save(); toast(x.name + ' approved → MENTOR'); render();
        }
        function rejectApp(id, btn) {
            const x = db.users.find(y => y.id === id); x.mentor = 'none'; save();
            db.notifs.push({ id: Date.now(), user: x.id, txt: 'Mentor application rejected — you can reapply in 30 days', kind: 'warn', ago: 'NOW' });
            save(); toast(x.name + ' rejected'); render();
        }
        VIEWS.assignments = () => {
            const u = me(); if (!u || u.role !== 'admin') return VIEWS.login();
            return shell(sideFor(u), '<h1>Assignments</h1><p class="lead">' + ASGS.length + ' published · live attempt counts</p>'
                + '<div class="tblw"><table><tr><th>Assignment</th><th>Difficulty</th><th>XP</th><th>Attempts</th><th></th></tr>'
                + ASGS.map(a => '<tr><td><b>' + esc(a.name) + '</b><div class="mono" style="color:var(--mut)">' + a.stack + '</div></td>'
                    + '<td>' + diffDot(a.diff) + a.diff + '</td><td class="mono">+' + a.xp + '</td><td class="mono">' + a.n + '</td>'
                    + '<td class="r"><span class="act" onclick="toast(\'Editing ships in v2 — this is the prototype\')">Edit</span></td></tr>').join('')
                + '</table></div>');
        };

        /* ══════════════════ MODAL + ⌘K ══════════════════ */
        function modal(inner) {
            const o = document.createElement('div'); o.className = 'ov'; o.id = 'mmodal';
            o.innerHTML = '<div class="cmdk" style="width:600px;padding:24px 26px">' + inner + '</div>';
            o.addEventListener('click', e => { if (e.target === o) o.remove() });
            document.body.appendChild(o);
        }
        function closeModal() { document.getElementById('mmodal')?.remove() }

        const CMDS = [
            ['dash', 'Dashboard / desk'], ['catalog', 'Assignments catalog'], ['attempts', 'My attempts'],
            ['leaderboard', 'Leaderboard'], ['profile', 'Profile'], ['notifications', 'Notifications'],
            ['mapp', 'Become a mentor'], ['queue', 'Review queue (mentor)'], ['users', 'Users (admin)'], ['mapps', 'Mentor apps (admin)']
        ];
        function openK() {
            const o = document.createElement('div'); o.className = 'ov'; o.id = 'kk';
            o.innerHTML = '<div class="cmdk"><input id="kq" placeholder="Search — jump anywhere…" oninput="fillK(this.value)"><div id="kl"></div></div>';
            o.addEventListener('click', e => { if (e.target === o) o.remove() });
            document.body.appendChild(o); fillK(''); setTimeout(() => document.getElementById('kq').focus(), 40);
        }
        function fillK(q) {
            q = (q || '').toLowerCase();
            const hits = CMDS.filter(c => c[1].toLowerCase().includes(q));
            document.getElementById('kl').innerHTML = hits.length
                ? hits.map(c => '<div class="it" onclick="closeK();go(\'' + c[0] + '\')">→ ' + c[1] + ' <small>PAGE</small></div>').join('')
                : '<div class="it" style="color:var(--mut)">No results</div>';
        }
        function closeK() { document.getElementById('kk')?.remove() }
        document.addEventListener('keydown', e => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('kk') ? closeK() : openK() }
            if (e.key === 'Escape') { closeK(); closeModal() }
        });

        function renderTabbar() {
            let old = document.getElementById('tabbar'); if (old) old.remove();
            const u = me();
            let tabs;
            if (!u) tabs = [['landing', '⌂', 'home'], ['catalog', '▤', 'work'], ['leaderboard', '↑', 'ranks'], ['login', '→', 'sign in']];
            else if (u.role === 'admin') tabs = [['dash', '◧', 'overview'], ['users', '≡', 'users'], ['mapps', '✦', 'apps'], ['notifications', '✉', 'inbox'], ['profile', '◎', 'me']];
            else if (u.role === 'mentor') tabs = [['dash', '◧', 'desk'], ['queue', '≡', 'queue'], ['leaderboard', '↑', 'ranks'], ['notifications', '✉', 'inbox'], ['profile', '◎', 'me']];
            else tabs = [['dash', '⌂', 'home'], ['catalog', '▤', 'work'], ['attempts', '≡', 'mine'], ['notifications', '✉', 'inbox'], ['profile', '◎', 'me']];
            const el = document.createElement('div'); el.id = 'tabbar';
            el.innerHTML = tabs.map(t => '<a class="' + (route === t[0] ? 'on' : '') + '" onclick="go(\'' + t[0] + '\')"><span class="ic">' + t[1] + '</span>' + t[2] + '</a>').join('');
            document.body.appendChild(el);
        }

        /* ══════════════════ BOOT ══════════════════ */
        render();
    </script>
</body>

</html>
