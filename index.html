<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>devhub — learning by building</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: 'Space Grotesk', sans-serif; font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; min-height: 100vh; transition: background .35s, color .35s; }
    :root { --bg: #FAFAF7; --ink: #141412; --mut: #8B8B82; --line: #E5E5DE; --card: #FFF; --acc: #2E5BFF; --soft: #EEF1FF; --ok: #1E9E5A; --warn: #C77E0A; --bad: #D64545; --gold: #B8860B; }
    html.dark { --bg: #0D0D0C; --ink: #F1F1EC; --mut: #87877F; --line: #252522; --card: #151513; --acc: #7B93FF; --soft: #181B2A; --gold: #E8B23D; }
    button { font-family: inherit; cursor: pointer; font-size: inherit; }
    a { color: inherit; text-decoration: none; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: .03em; }
    #hd { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 26px; padding: 0 36px; height: 60px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); }
    .wm { font-weight: 700; font-size: 17px; letter-spacing: -.02em; cursor: pointer; }
    .wm i { color: var(--acc); font-style: normal; }
    #hd nav { display: flex; gap: 4px; }
    #hd nav a { padding: 6px 12px; border-radius: 8px; font-size: 14px; color: var(--mut); cursor: pointer; transition: .18s; }
    #hd nav a:hover { color: var(--ink); transform: translateY(-1px); }
    #hd nav a.on { color: var(--acc); font-weight: 600; background: var(--soft); }
    .sp { flex: 1; }
    .ib { background: none; border: 1px solid var(--line); border-radius: 9px; width: 35px; height: 35px; display: inline-flex; align-items: center; justify-content: center; color: var(--mut); position: relative; transition: .18s; }
    .ib:hover { color: var(--ink); border-color: var(--ink); transform: translateY(-1px); }
    .ib .n { position: absolute; top: -5px; right: -5px; background: var(--acc); color: #fff; font-size: 9px; font-weight: 700; min-width: 15px; height: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; animation: pulse 1.8s ease-in-out infinite; }
    .av { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; transition: .2s; }
    .av:hover { transform: scale(1.1) rotate(6deg); }
    #view { min-height: calc(100vh - 60px); }
    .split { display: flex; }
    .side { width: 212px; border-right: 1px solid var(--line); padding: 28px 14px; flex-shrink: 0; display: flex; flex-direction: column; min-height: calc(100vh - 60px); }
    .side a { display: flex; gap: 10px; align-items: center; padding: 9px 13px; border-radius: 8px; color: var(--mut); font-size: 14px; cursor: pointer; margin-bottom: 2px; transition: .18s; }
    .side a.on { background: var(--soft); color: var(--acc); font-weight: 600; }
    .side a:hover { color: var(--ink); padding-left: 17px; }
    .side .grow { flex: 1; }
    .main { flex: 1; padding: 44px 48px; min-width: 0; }
    h1 { font-size: 29px; letter-spacing: -.03em; font-weight: 700; }
    h2 { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--mut); margin: 34px 0 14px; font-weight: 600; }
    .lead { color: var(--mut); margin: 6px 0 30px; }
    .btn { border-radius: 9px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); padding: 9px 18px; font-size: 13.5px; font-weight: 600; transition: .15s; display: inline-flex; gap: 8px; align-items: center; }
    .btn:hover { opacity: .86; transform: translateY(-1px); }
    .btn:active { transform: translateY(1px) scale(.98); }
    .btn.acc { background: var(--acc); border-color: var(--acc); color: #fff; }
    .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
    .btn.gh { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn.gh:hover { border-color: var(--ink); opacity: 1; }
    .btn.sm { padding: 6px 12px; font-size: 12.5px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; transition: transform .22s ease, box-shadow .22s ease, border-color .22s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.08); border-color: color-mix(in srgb, var(--acc) 35%, var(--line)); }
    .grid { display: grid; gap: 14px; }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g2 { grid-template-columns: repeat(2, 1fr); }
    .pill { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 3px 10px; border-radius: 99px; font-weight: 500; display: inline-block; animation: pop .35s cubic-bezier(.2, .9, .3, 1.3); }
    .pg { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
    .py { color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); }
    .pr { color: var(--bad); background: color-mix(in srgb, var(--bad) 11%, transparent); }
    .pb { color: var(--acc); background: var(--soft); }
    .pn { color: var(--mut); background: color-mix(in srgb, var(--mut) 13%, transparent); }
    .pw { color: var(--gold); background: color-mix(in srgb, var(--gold) 15%, transparent); }
    .pa { color: #fff; background: linear-gradient(135deg, var(--acc), #8B5CF6); background-size: 200% 200%; animation: grad 4s ease infinite; }
    .star { font-size: 19px; color: var(--line); line-height: 1; display: inline-block; transition: transform .15s; }
    .star.on { color: var(--gold); }
    .starrow { display: flex; gap: 3px; }
    .starrow .star:hover { transform: scale(1.35) rotate(10deg); }
    .xpbar { height: 5px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
    .xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), #8B5CF6); border-radius: 99px; transition: width 1s cubic-bezier(.25, .8, .3, 1); }
    .rank1 { color: var(--gold); font-weight: 700; }
    .reviewrow { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .reviewrow:last-child { border: none; }
    .chip { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--line); color: var(--mut); background: none; transition: .18s; }
    .chip:hover { transform: translateY(-1px); border-color: var(--mut); }
    .chip.on { border-color: var(--acc); color: var(--acc); background: var(--soft); }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 22px; }
    input, select, textarea { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; font-size: 14px; font-family: inherit; color: var(--ink); transition: border-color .2s, box-shadow .2s; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--soft); }
    label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--mut); display: block; margin: 16px 0 7px; }
    .tblw { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); text-align: left; font-weight: 600; padding: 11px 16px; border-bottom: 1px solid var(--line); }
    td { padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: 14px; transition: background .15s; }
    tr:hover td { background: color-mix(in srgb, var(--acc) 3%, transparent); }
    tr:last-child td { border: none; }
    .act { color: var(--acc); font-weight: 600; font-size: 13px; cursor: pointer; }
    .act:hover { text-decoration: underline; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .stat { background: var(--card); padding: 20px 22px; transition: background .2s; }
    .stat:hover { background: color-mix(in srgb, var(--acc) 4%, var(--card)); }
    .stat span { font-size: 10.5px; color: var(--mut); font-family: 'JetBrains Mono', monospace; letter-spacing: .07em; }
    .stat b { font-size: 30px; font-weight: 700; letter-spacing: -.03em; display: block; margin: 4px 0 2px; }
    .avsm { width: 24px; height: 24px; border-radius: 50%; background: var(--line); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; vertical-align: middle; margin-right: 6px; }
    .fade { animation: fd .35s ease; }
    @keyframes fd { from { opacity: 0; transform: translateY(8px); } }
    .rise { opacity: 0; animation: rise .5s cubic-bezier(.2, .8, .3, 1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .empty { border: 1px dashed var(--line); border-radius: 12px; padding: 36px; text-align: center; color: var(--mut); }
    .toast { position: fixed; right: 24px; background: var(--ink); color: var(--bg); padding: 13px 18px; border-radius: 10px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; z-index: 99; animation: tin .3s cubic-bezier(.2, .9, .3, 1.2); max-width: 360px; box-shadow: 0 14px 40px rgba(0,0,0,.28); transition: opacity .4s, transform .4s; }
    .toast.out { opacity: 0; transform: translateX(30px); }
    .toast .d { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; animation: pulse 1.5s infinite; }
    @keyframes tin { from { transform: translateX(60px); opacity: 0; } }
    .ov { position: fixed; inset: 0; background: rgba(0,0,0,.42); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; z-index: 80; padding-top: 12vh; animation: ovin .2s ease; }
    @keyframes ovin { from { opacity: 0; } }
    .modal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; width: 600px; max-width: 92vw; max-height: 80vh; overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,.3); padding: 24px 26px; animation: min .3s cubic-bezier(.2, .9, .3, 1.15); }
    @keyframes min { from { opacity: 0; transform: scale(.94) translateY(14px); } }
    .authbox { max-width: 390px; margin: 11vh auto; padding: 0 24px; }
    .hero { max-width: 920px; margin: 0 auto; padding: 96px 40px 72px; position: relative; overflow: visible; }
    .hero h1 { font-size: clamp(36px, 5.6vw, 60px); line-height: 1.06; letter-spacing: -.04em; }
    .hero h1 em { color: var(--acc); font-style: normal; background: linear-gradient(135deg, var(--acc), #8B5CF6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: var(--mut); font-size: 17.5px; margin: 20px 0 32px; max-width: 560px; }
    .blob { position: absolute; top: -60px; right: -80px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--acc) 22%, transparent), transparent 70%); filter: blur(10px); animation: float 7s ease-in-out infinite; pointer-events: none; z-index: -1; }
    @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-24px) scale(1.06); } }
    .tick { display: flex; gap: 22px; margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--mut); flex-wrap: wrap; }
    .tick b { color: var(--ink); }
    .tick .dot { display: inline-block; animation: pulse 2s infinite; color: var(--acc); }
    .feat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
    .feat>div { background: var(--bg); padding: 38px 34px; transition: background .25s; }
    .feat>div:hover { background: color-mix(in srgb, var(--acc) 4%, var(--bg)); }
    .feat .n { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--acc); }
    .feat b { display: block; font-size: 16.5px; margin: 12px 0 6px; }
    .feat p { color: var(--mut); font-size: 14px; }
    .cf { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 98; pointer-events: none; animation: cfall linear forwards; }
    @keyframes cfall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    #burger { display: none; }
    .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 45; animation: ovin .2s; }
    @media (max-width: 840px) {
      #burger { display: inline-flex; }
      .side { position: fixed; left: 0; top: 60px; bottom: 0; z-index: 46; background: var(--bg); transform: translateX(-100%); transition: transform .3s cubic-bezier(.2, .9, .3, 1); box-shadow: 8px 0 30px rgba(0,0,0,.15); }
      .side.open { transform: none; }
      .main { padding: 24px 18px; }
      .g3, .g2 { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      #hd { padding: 0 14px; gap: 10px; }
      #hd nav { display: none; }
      .hero { padding: 56px 22px 48px; }
      .feat { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .rise { opacity: 1; } }
  </style>
</head>
<body>
<header id="hd">
  <button class="ib" id="burger" onclick="toggleDrawer()">☰</button>
  <div class="wm" onclick="go('landing')">dev<i>/</i>hub</div>
  <nav id="nav"></nav>
  <div class="sp"></div>
  <button class="ib" onclick="toggleTheme()">◐</button>
  <span id="hdRight"></span>
</header>
<div id="view"></div>

<script>
"use strict";
const DB_KEY = 'devhub_v4';
const SESSION_KEY = 'devhub_session';

function freshDb() {
  return {
    nextId: 100,
    users: [
      { id: 1, name: 'Karim Senior', email: 'senior@dev.io', pw: 'demo1234', role: 'senior', xp: 0, linkedin: 'linkedin.com/in/karim-senior', seniorReq: null },
      { id: 2, name: 'Sara Junior', email: 'junior@dev.io', pw: 'demo1234', role: 'junior', xp: 0, linkedin: '', seniorReq: null },
      { id: 3, name: 'Omar K.', email: 'omar@dev.io', pw: 'demo1234', role: 'junior', xp: 0, linkedin: 'linkedin.com/in/omar-k', seniorReq: { status: 'pending', linkedin: 'linkedin.com/in/omar-k', ago: '1D AGO' } },
      { id: 4, name: 'Admin', email: 'admin@dev.io', pw: 'demo1234', role: 'admin', xp: 0, linkedin: '', seniorReq: null }
    ],
    projects: [],
    subs: [],
    seniorReviews: [],
    notifs: []
  };
}

function normalizeDb() {
  if (!db.users.some(u => u.role === 'admin')) {
    db.users.push({ id: db.nextId++, name: 'Admin', email: 'admin@dev.io', pw: 'demo1234', role: 'admin', xp: 0, linkedin: '', seniorReq: null });
  }
  if (!db.seniorReviews) db.seniorReviews = [];
  db.users.forEach(u => {
    if (u.xp == null) u.xp = 0;
    if (u.linkedin == null) u.linkedin = '';
    if (u.seniorReq === undefined) u.seniorReq = null;
  });
  db.subs.forEach(s => { if (s.rated == null) s.rated = false; });
}

let db;
try { db = JSON.parse(localStorage.getItem(DB_KEY)); } catch (e) { db = null; }
if (!db || !db.users) { db = freshDb(); }
normalizeDb();
function save() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
save();

function resetDemo() { localStorage.removeItem(DB_KEY); sessionStorage.removeItem(SESSION_KEY); location.reload(); }
function setSession(uid) { if (uid == null) sessionStorage.removeItem(SESSION_KEY); else sessionStorage.setItem(SESSION_KEY, String(uid)); }
function getSession() { const v = sessionStorage.getItem(SESSION_KEY); return v ? parseInt(v, 10) : null; }

window.addEventListener('storage', function(e) {
  if (e.key !== DB_KEY) return;
  try { db = JSON.parse(e.newValue); } catch (err) { return; }
  normalizeDb(); render();
});

function me() { const id = getSession(); return id ? (db.users.find(u => u.id === id) || null) : null; }
function uname(id) { const u = db.users.find(u => u.id === id); return u ? u.name : '—'; }
function proj(id) { return db.projects.find(p => p.id === id); }

function reqsBadge(p) {
  if (p.pdf && p.pdf.data) {
    return '<span class="act mono" onclick="event.stopPropagation();viewPdf(\'' + esc(p.id) + '\')">📄 ' + esc(p.pdf.name) + ' — view requirements ↗</span>';
  }
  return '<span class="mono" style="color:var(--mut)">No PDF requirements uploaded</span>';
}
function viewPdf(pid) {
  const p = proj(pid);
  if (!p || !p.pdf || !p.pdf.data) { toast('No PDF requirements uploaded'); return; }
  window.open(p.pdf.data, '_blank');
}
function subsOf(pid) { return db.subs.filter(s => s.project === pid); }
function $(sel) { return document.querySelector(sel); }
function $all(sel) { return Array.from(document.querySelectorAll(sel)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

let toastCount = 0;
function toast(m) {
  const t = document.createElement('div'); t.className = 'toast';
  t.style.bottom = (24 + toastCount * 62) + 'px'; toastCount++;
  t.innerHTML = '<span class="d"></span><span>' + esc(m) + '</span>';
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('out'); toastCount--; }, 2600);
  setTimeout(() => t.remove(), 3100);
}

function toggleTheme() { document.documentElement.classList.toggle('dark'); }
function toggleDrawer() {
  const s = $('.side');
  if (!s) return;
  const open = s.classList.toggle('open');
  if (open) {
    const sc = document.createElement('div'); sc.className = 'scrim'; sc.id = 'scrim';
    sc.onclick = toggleDrawer; document.body.appendChild(sc);
  } else { const sc = $('#scrim'); if (sc) sc.remove(); }
}
function notify(uid, txt, kind) { db.notifs.push({ id: db.nextId++, user: uid, txt: txt, kind: kind || 'acc', ago: 'NOW' }); }
function myNotifs() { const u = me(); return u ? db.notifs.filter(n => n.user === u.id) : []; }
function xpOf(u) { return u && u.xp ? u.xp : 0; }
function seniorRating(uid) {
  const r = db.seniorReviews.filter(x => x.senior === uid);
  if (!r.length) return { avg: 0, count: 0 };
  return { avg: r.reduce((a, x) => a + x.stars, 0) / r.length, count: r.length };
}
function starsRow(n, interactive) {
  let s = '<span class="starrow" id="starpick">';
  for (let i = 1; i <= 5; i++) {
    s += '<span class="star' + (i <= n ? ' on' : '') + '"' + (interactive ? ' onclick="pickStar(' + i + ')" style="cursor:pointer"' : '') + '>' + (i <= n ? '★' : '☆') + '</span>';
  }
  return s + '</span>';
}
function ratingBadge(uid) {
  const r = seniorRating(uid);
  if (!r.count) return '<span class="pill pn">No reviews yet</span>';
  return '<span class="pill pw">★ ' + r.avg.toFixed(1) + ' · ' + r.count + ' review' + (r.count > 1 ? 's' : '') + '</span>';
}
function pendingSeniorReqs() { return db.users.filter(u => u.seniorReq && u.seniorReq.status === 'pending'); }

function fx() {
  $all('.grid, .feat, .stats').forEach(g => {
    Array.from(g.children).forEach((c, i) => {
      c.classList.add('rise');
      c.style.animationDelay = (i * 70) + 'ms';
    });
  });
  $all('[data-count]').forEach(el => {
    const target = +el.getAttribute('data-count'), dur = 800;
    if (el._counted) return; el._counted = true;
    let start = null;
    function step(ts) {
      if (!start) start = ts;
      const p = Math.min((ts - start) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * e);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
  requestAnimationFrame(() => {
    $all('.xpbar i').forEach(b => { b.style.width = b.getAttribute('data-w'); });
  });
}

function confetti() {
  const colors = ['#2E5BFF', '#8B5CF6', '#1E9E5A', '#E8B23D', '#D64545'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div'); c.className = 'cf';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.animationDelay = (Math.random() * .4) + 's';
    document.body.appendChild(c);
    setTimeout(cc => cc.remove(), 4500);
  }
}

let route = 'landing';
function go(r) { if (r !== 'profile') profileEditing = false; route = r; closeDrawerIfOpen(); render(); window.scrollTo(0, 0); }
function closeDrawerIfOpen() {
  const s = $('.side'); if (s) s.classList.remove('open');
  const sc = $('#scrim'); if (sc) sc.remove();
}

function render() {
  const u = me(), nav = $('#nav');
  if (!u) {
    nav.innerHTML = '<a class="' + (route === 'landing' ? 'on' : '') + '" onclick="go(\'landing\')">Home</a>' +
      '<a class="' + (route === 'projects' ? 'on' : '') + '" onclick="go(\'projects\')">Projects</a>';
    $('#hdRight').innerHTML = '<button class="btn gh sm" onclick="go(\'login\')">Sign in</button> <button class="btn sm" onclick="go(\'register\')">Sign up</button>';
  } else if (u.role === 'admin') {
    const links = [['admin', 'Admin panel'], ['projects', 'All projects'], ['leaderboard', 'Leaderboard']];
    nav.innerHTML = links.map(l => '<a class="' + (route === l[0] ? 'on' : '') + '" onclick="go(\'' + l[0] + '\')">' + l[1] + '</a>').join('');
    const pend = pendingSeniorReqs().length;
    $('#hdRight').innerHTML = '<button class="ib" onclick="go(\'admin\')" title="Pending requests">⚑' + (pend ? '<span class="n">' + pend + '</span>' : '') + '</button>' +

  } else {
    const links = u.role === 'senior' ?
      [['dash', 'Desk'], ['projects', 'All projects'], ['myprojects', 'My projects'], ['leaderboard', 'Leaderboard']] :
      [['dash', 'Dashboard'], ['projects', 'Browse projects'], ['mysubs', 'My work'], ['leaderboard', 'Leaderboard']];

function drawProjects() {
  const el = document.getElementById('pgrid'); if (!el) return;
  const u = me();
  let list = db.projects.filter(p => {
    if (pQuery && p.title.toLowerCase().indexOf(pQuery.toLowerCase()) < 0) return false;
    const full = subsOf(p.id).length >= p.slots;
    if (pFilter === 'open') return !full;
    if (pFilter === 'full') return full;
    if (pFilter === 'mine') return u ? subsOf(p.id).some(s => s.junior === u.id) : false;
    return true;
  });
  if (!list.length) { el.innerHTML = '<div class="empty">No projects match.</div>'; return; }
  el.innerHTML = '<div class="grid g3">' + list.map(p => {
    const cnt = subsOf(p.id).length, full = cnt >= p.slots;
    return '<div class="card">' +
      '<div class="mono" style="color:var(--mut)">BY ' + esc(uname(p.senior)).toUpperCase() + '</div>' +
      '<b style="display:block;margin:10px 0 6px;font-size:16px">' + esc(p.title) + '</b>' +
      '<p style="font-size:13px;color:var(--mut);margin-bottom:10px">' + esc(p.desc) + '</p>' +

const XP_JUNIOR_APPROVED = 50, XP_SENIOR_VALIDATED = 30;
function sendReview(sid) {
  const s = db.subs.find(x => x.id === sid);
  const fb = document.getElementById('vfb').value.trim();
  s.status = verdict; s.feedback = fb; s.ago = 'JUST NOW'; s.rated = false;
  const p = proj(s.project);
  if (verdict === 'approved') {
    const j = db.users.find(x => x.id === s.junior);
    const sr = db.users.find(x => x.id === p.senior);
    if (j) j.xp = xpOf(j) + XP_JUNIOR_APPROVED;
    if (sr) sr.xp = xpOf(sr) + XP_SENIOR_VALIDATED;
    confetti();
  }
  notify(s.junior, 'Your submission for "' + p.title + '" was ' +
    (verdict === 'approved' ? 'APPROVED 🎉 (+' + XP_JUNIOR_APPROVED + ' xp)' : 'sent back with feedback'),
    verdict === 'approved' ? 'ok' : 'bad');
  save(); closeModal();
  toast(verdict === 'approved' ? 'Approved — junior notified' : 'Changes requested');
  render();
}

function createProject() {
  const meU = me();
  if (!meU || meU.role !== 'senior') { go('login'); return; }
  const t = document.getElementById('np-t').value.trim(), d = document.getElementById('np-d').value.trim();
  const sl = parseInt(document.getElementById('np-s').value, 10);
  const c = document.getElementById('np-c').value.trim() || 'discord.gg/yourserver';
  const pdfInput = document.getElementById('np-pdf');
  const file = pdfInput.files && pdfInput.files[0];
  const errBox = document.getElementById('np-err');
  if (!t || !d || !sl || sl < 1 || !file) {
    errBox.innerHTML = '<div class="card" style="border-left:3px solid var(--bad);padding:12px 16px;margin-top:14px;font-size:13.5px">Title, description, slots (≥1) and a PDF of the requirements are all required.</div>';
    return;
  }
  if (file.type !== 'application/pdf') {
    errBox.innerHTML = '<div class="card" style="border-left:3px solid var(--bad);padding:12px 16px;margin-top:14px;font-size:13.5px">The requirements file must be a PDF.</div>';
    return;
  }
  errBox.innerHTML = '';
  const reader = new FileReader();
  reader.onload = function() {
    const n = db.projects.length + 1;
    db.projects.push({
      id: 'P-' + (n < 10 ? '0' : '') + n,
      senior: meU.id, title: t, desc: d, slots: sl, discord: c,
      pdf: { name: file.name, data: reader.result }
    });
    save();
    toast('Project published — juniors can now subscribe');
    go('myprojects');
  };
  reader.onerror = function() {
    errBox.innerHTML = '<div class="card" style="border-left:3px solid var(--bad);padding:12px 16px;margin-top:14px;font-size:13.5px">Could not read that PDF — please try again.</div>';
  };
  reader.readAsDataURL(file);
}

function xpBarHtml(xp, maxXp) {
  return '<div class="xpbar" style="width:80px"><i data-w="' + Math.round(xp / maxXp * 100) + '%"></i></div>';
}

function leaderboardJuniors() {
  const rows = db.users.filter(u => u.role === 'junior').map(u => {
    const m = db.subs.filter(s => s.junior === u.id);
    return { u: u, subs: m.length, ok: m.filter(s => s.status === 'approved').length, xp: xpOf(u) };
  }).sort((a, b) => b.xp - a.xp);
  const maxXp = Math.max.apply(null, rows.map(r => r.xp).concat([1]));
  return '<div class="tblw"><table><tr><th>#</th><th>Junior</th><th>XP</th><th>Subscriptions</th><th>Approved</th></tr>' +
    (rows.length ?
      rows.map((r, i) => {
        return '<tr><td class="mono' + (i === 0 ? ' rank1' : '') + '" style="' + (i === 0 ? '' : 'color:var(--mut)') + '">' + (i === 0 ? '★' : String(i + 1).padStart(2, '0')) + '</td>' +
          '<td><span class="avsm">' + esc(r.u.name.charAt(0)) + '</span><b>' + esc(r.u.name) + '</b></td>' +
          '<td class="mono"><b>' + r.xp + '</b> xp' + xpBarHtml(r.xp, maxXp) + '</td>' +
          '<td>' + r.subs + '</td>' +
          '<td><span class="pill ' + (r.ok ? 'pg' : 'pn') + '">' + r.ok + '</span></td></tr>';
      }).join('') :
      '<tr><td colspan="5" style="color:var(--mut);text-align:center;padding:26px">No juniors yet</td></tr>') +
    '</table></div>';
}

function leaderboardSeniors() {
  const rows = db.users.filter(u => u.role === 'senior').map(u => {
    const validated = db.projects.filter(p => p.senior === u.id).reduce((a, p) => {
      return a + db.subs.filter(s => s.project === p.id && s.status === 'approved').length;
    }, 0);
    return { u: u, xp: xpOf(u), validated: validated };
  }).sort((a, b) => b.xp - a.xp);
  const maxXp = Math.max.apply(null, rows.map(r => r.xp).concat([1]));
  return '<div class="tblw"><table><tr><th>#</th><th>Senior</th><th>XP</th><th>Projects validated</th><th>Rating</th></tr>' +
    (rows.length ?
      rows.map((r, i) => {
        return '<tr><td class="mono' + (i === 0 ? ' rank1' : '') + '" style="' + (i === 0 ? '' : 'color:var(--mut)') + '">' + (i === 0 ? '★' : String(i + 1).padStart(2, '0')) + '</td>' +
          '<td><span class="avsm">' + esc(r.u.name.charAt(0)) + '</span><b>' + esc(r.u.name) + '</b></td>' +
          '<td class="mono"><b>' + r.xp + '</b> xp' + xpBarHtml(r.xp, maxXp) + '</td>' +
          '<td>' + r.validated + '</td>' +
          '<td>' + ratingBadge(r.u.id) + '</td></tr>';
      }).join('') :
      '<tr><td colspan="5" style="color:var(--mut);text-align:center;padding:26px">No seniors yet</td></tr>') +
    '</table></div>';
}

  const u = me();
  if (!u || u.role !== 'admin') {
    return shell('<h1 style="color:var(--bad)">Access denied</h1><p class="lead">Admin area. Sign in as <b>admin@dev.io</b> / <b>demo1234</b>.</p>');
  }
  const reqs = pendingSeniorReqs();
  let html = '<h1>Admin panel</h1><p class="lead">Full oversight of the platform.</p>' +
    '<div class="stats">' +
    '<div class="stat"><span>USERS</span><b data-count="' + db.users.length + '">0</b></div>' +
    '<div class="stat"><span>PROJECTS</span><b data-count="' + db.projects.length + '">0</b></div>' +
    '<div class="stat"><span>SUBMISSIONS</span><b data-count="' + db.subs.length + '">0</b></div>' +
    '<div class="stat"><span>PENDING SENIOR REQ.</span><b style="color:' + (reqs.length ? 'var(--warn)' : 'var(--ink)') + '" data-count="' + reqs.length + '">0</b></div>' +
    '</div>';
  if (reqs.length) {
    html += '<h2>Senior promotion requests</h2>' +
      reqs.map(r => {
        return '<div class="card" style="margin-bottom:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">' +
          '<span class="avsm" style="width:32px;height:32px;font-size:12px">' + esc(r.name.charAt(0)) + '</span>' +
          '<div><b>' + esc(r.name) + '</b><div class="mono" style="color:var(--mut);font-size:10.5px">' + esc(r.email) + ' · ' + esc(r.seniorReq.linkedin || 'no linkedin') + '</div></div>' +
          '<div style="flex:1"></div>' +
          '<button class="btn ok sm" onclick="decideSenior(' + r.id + ',true)">Approve</button>' +
          '<button class="btn gh sm" style="color:var(--bad)" onclick="decideSenior(' + r.id + ',false)">Reject</button>' +
          '</div>';
      }).join('');
  }
  html += '<h2>All users</h2><div class="tblw"><table><tr><th>User</th><th>Email</th><th>Role</th><th>XP</th><th></th></tr>' +
    db.users.map(x => {
      return '<tr><td><span class="avsm">' + esc(x.name.charAt(0)) + '</span><b>' + esc(x.name) + '</b></td>' +
        '<td class="mono" style="color:var(--mut)">' + esc(x.email) + '</td>' +
        '<td><span class="pill ' + (x.role === 'admin' ? 'pa' : x.role === 'senior' ? 'pb' : 'pg') + '">' + x.role.toUpperCase() + '</span></td>' +
        '<td class="mono">' + xpOf(x) + '</td>' +
        '<td>' + (x.role === 'junior' ? '<span class="act" onclick="forceSenior(' + x.id + ',this)">make senior</span>' : '') + '</td></tr>';
    }).join('') + '</table></div>';
  html += '<h2>All submissions</h2><div class="tblw"><table><tr><th>Project</th><th>Junior</th><th>Status</th><th>Repo</th></tr>' +
    (db.subs.length ? db.subs.map(s => {
      const p = proj(s.project);
      return '<tr><td>' + (p ? esc(p.title) : '—') + '</td>' +
        '<td><span class="avsm">' + esc(uname(s.junior).charAt(0)) + '</span>' + esc(uname(s.junior)) + '</td>' +
        '<td>' + subPill(s.status) + '</td>' +
        '<td class="mono" style="color:var(--mut)">' + (s.repo ? '<span class="act" onclick="toast(\'Opening repo… (demo)\')">open ↗</span>' : '—') + '</td></tr>';
    }).join('') : '<tr><td colspan="4" style="color:var(--mut);text-align:center;padding:26px">No submissions</td></tr>') +
    '</table></div>';
  return shell(html);
};

function decideSenior(uid, ok) {
  const x = db.users.find(v => v.id === uid);
  if (!x || !x.seniorReq) return;
  x.seniorReq.status = ok ? 'approved' : 'rejected';
  if (ok) x.role = 'senior';
  notify(uid, ok ? 'Your senior request was APPROVED — welcome to the seniors side 🎉' : 'Your senior request was rejected', ok ? 'ok' : 'bad');
  save();
  toast(ok ? x.name + ' is now a senior' : 'Request rejected');
  render();
}

function forceSenior(uid) {
  const x = db.users.find(v => v.id === uid);
  if (!x) return;
  x.role = 'senior';
  notify(uid, 'An admin promoted you to senior directly', 'ok');
  save();
  toast(x.name + ' promoted to senior');
  render();
}

function modal(html) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'ov'; ov.id = 'ov';
  ov.innerHTML = '<div class="modal">' + html + '</div>';
  ov.addEventListener('click', function(e) { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal() {
  const ov = document.getElementById('ov');
  if (!ov) return;
  ov.style.animation = 'ovin .15s reverse forwards';
  const m = ov.firstElementChild;
  if (m) m.style.animation = 'min .15s reverse forwards';
  setTimeout(() => { ov.remove(); }, 150);
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

render();
</script>
</body>
</html>
